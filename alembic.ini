# Alembic configuration.
#
# The database URL is NOT hardcoded here: migrations/env.py reads it from
# app.config.DATABASE_URL so the CLI, the app lifespan and Docker all use the
# same URL (override with the DATABASE_URL environment variable).

[alembic]
# Path to the migration scripts directory.
script_location = migrations

# Make the repository root importable so `from app import ...` works when
# running the alembic CLI from the repo root.
prepend_sys_path = .
path_separator = os

# Set programmatically in migrations/env.py from app.config.DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
