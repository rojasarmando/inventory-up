<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title">Inventario Kajataca</title>
  <link rel="shortcut icon" href="/static/images/icono.ico">

  <!-- Theme bootstrap (runs before body renders to avoid FOUC) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", t);
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-kajataca">
    <div class="container-fluid">
      <a class="navbar-brand" href="/home">
        <span class="brand-mark"><i class="bi bi-box-seam"></i></span>
        <span data-i18n="app.brand">Kajataca</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#mainNavbar" aria-controls="mainNavbar"
        aria-expanded="false" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="mainNav"></ul>
        <div class="d-flex align-items-center gap-2">
          <span class="user-chip d-none d-md-inline-flex" id="navbarUserName"></span>
          <button type="button" class="btn btn-sm btn-outline-danger"
            id="logoutBtn" data-i18n="app.logout">Cerrar sesión</button>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2 ms-lg-2">
        <button type="button" class="btn btn-outline-secondary btn-icon"
          id="themeToggle" data-theme-toggle data-i18n-title="theme.toggle"
          aria-label="Toggle theme">
          <i class="bi bi-moon-stars"></i>
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3"
          data-lang-toggle="en">EN</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <!-- Shared confirmation modal -->
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" data-i18n="common.confirm">Confirmar</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="common.no">No</button>
          <button type="button" class="btn btn-kajataca" id="confirmOk" data-i18n="common.yes">Sí</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <span class="clock" id="footerClock"></span>
    <span aria-hidden="true">·</span>
    <span>Armando Rojas 2018</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/menu.js"></script>
  <script>
    // Footer clock (like the original index.php)
    function tickClock() {
      const el = document.getElementById("footerClock");
      if (el) el.textContent = new Date().toLocaleTimeString();
    }
    tickClock();
    setInterval(tickClock, 1000);
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
