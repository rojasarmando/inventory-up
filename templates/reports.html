{% extends "base.html" %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">
    <i class="bi bi-bar-chart"></i>
    <span data-i18n="reports.title">Reportes</span>
  </h1>
</div>

<div class="card card-kajataca mx-auto" style="max-width: 640px;">
  <div class="card-header">
    <h1 class="h4 mb-0 d-flex align-items-center gap-2">
      <i class="bi bi-file-earmark-pdf text-accent"></i>
      <span data-i18n="reports.title">Reportes</span>
    </h1>
  </div>
  <div class="card-body">
    <p class="text-muted" data-i18n="reports.description">
      Genere el reporte de usuarios en formato PDF.
    </p>
    <a class="btn btn-kajataca" href="/api/reports/users" target="_blank" rel="noopener">
      <i class="bi bi-download me-1"></i>
      <span data-i18n="reports.users_pdf">Reporte de Usuarios (PDF)</span>
    </a>
  </div>
</div>
{% endblock %}
