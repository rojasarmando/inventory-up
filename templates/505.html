<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="error505.title">Error 505 - Error interno del servidor</title>
  <link rel="shortcut icon" href="/static/images/icono.ico">

  <!-- Theme bootstrap (runs before body renders to avoid FOUC) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", t);
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="error-page">
  <div class="error-box">
    <div class="error-icon"><i class="bi bi-exclamation-triangle"></i></div>
    <div class="error-code">505</div>
    <h1 data-i18n="error505.title">Error 505 - Error interno del servidor</h1>
    <p class="text-muted" data-i18n="error505.text">
      Ocurrió un error inesperado. Intente nuevamente más tarde.
    </p>
    <a href="/" class="btn btn-kajataca" data-i18n="error.back_home">Volver al Inicio</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/theme.js"></script>
  <script>KajatacaI18n.initI18n();</script>
</body>
</html>
